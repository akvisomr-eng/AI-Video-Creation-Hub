name: Generation queue worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generation-queue-worker
  cancel-in-progress: false

jobs:
  process-one-job:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger one queued generation job
        env:
          WORKER_URL: ${{ secrets.GENERATION_WORKER_URL }}
          WORKER_SECRET: ${{ secrets.GENERATION_WORKER_SECRET }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        if: ${{ env.WORKER_URL != '' && env.WORKER_SECRET != '' && env.VERCEL_BYPASS != '' }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 75 \
            --request POST \
            --header "Authorization: Bearer ${WORKER_SECRET}" \
            --header "x-vercel-protection-bypass: ${VERCEL_BYPASS}" \
            "${WORKER_URL}"
      - name: Explain missing scheduler secrets
        env:
          WORKER_URL: ${{ secrets.GENERATION_WORKER_URL }}
          WORKER_SECRET: ${{ secrets.GENERATION_WORKER_SECRET }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        if: ${{ env.WORKER_URL == '' || env.WORKER_SECRET == '' || env.VERCEL_BYPASS == '' }}
        run: echo "Worker is idle. Configure GENERATION_WORKER_URL and GENERATION_WORKER_SECRET repository secrets to activate scheduled processing."
